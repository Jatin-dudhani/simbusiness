name: CI/CD & Vercel Automated Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce least privilege access across the workflow
permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build & Typecheck Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_ADMIN_EMAIL: 'jatindudhani07@gmail.com'
          NEXT_PUBLIC_CONTACT_EMAIL: 'jatindudhani07@gmail.com'

  deploy-to-vercel:
    name: Trigger Automated Vercel Production Deployment
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notify Vercel Production Deploy Hook
        run: |
          echo "Triggering automated Vercel production build for commit ${{ github.sha }}..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.vercel.com/v1/integrations/deploy/prj_zaP20oGKwW906OsAA71bnyRpAnme/DRqno89aow")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Vercel Deploy Hook Response Status: $HTTP_STATUS"
          echo "Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully initiated Vercel automated deployment!"
          else
            echo "Vercel hook returned status $HTTP_STATUS, check output above."
            exit 1
          fi
